name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Game logic tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk almuzare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: almuzare-apk
          path: almuzare.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: المزارع — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: almuzare.apk
          body: |
            نزّل ملف almuzare.apk على جوالك الأندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            الفرع: ${{ github.ref_name }}
