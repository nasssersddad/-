name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Game logic tests
        run: node --test tests/*.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk almuzare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: almuzare-apk
          path: almuzare.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: المزارع — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: almuzare.apk
          body: |
            نزّل ملف almuzare.apk على جوالك الأندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            الفرع: ${{ github.ref_name }}

      # ===== نسخة Google Play (AAB موقّع) =====
      # تشتغل بس إذا حطيت مفتاح التوقيع بأسرار المستودع (KEYSTORE_BASE64 وغيره). الخطوات في store/listing.md
      - name: Decode signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/almuzare.jks"

      - name: Build signed Play bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/almuzare.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Play bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: almuzare-play
          path: android/app/build/outputs/bundle/release/app-release.aab
