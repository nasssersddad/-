plugins {
    id 'com.android.application'
}

// القيم تجي من متغيرات البيئة (أسرار GitHub) أو من gradle.properties، وإذا ما فيه نرجع للافتراضي
def cfg = { String key, String fallback = null ->
    def v = System.getenv(key) ?: project.findProperty(key)
    return v ? v.toString() : fallback
}

// ===== معرّفات AdMob =====
// الافتراضي تجريبي رسمي من Google. حط معرّفاتك بأسرار GitHub باسم ADMOB_APP_ID و ADMOB_REWARDED_ID
def testAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def testRewardedId = 'ca-app-pub-3940256099942544/5224354917'
def admobAppId = cfg('ADMOB_APP_ID', testAdmobAppId)
def admobRewardedId = cfg('ADMOB_REWARDED_ID', testRewardedId)

// رقم النسخة يزيد مع كل بناء (البناء الآلي يحط VERSION_CODE = رقم التشغيل)
def appVersionCode = cfg('VERSION_CODE', '1').toInteger()

// مفتاح التوقيع لنسخة Google Play
def keystorePath = cfg('KEYSTORE_FILE')
def hasKeystore = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'com.almuzare.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.almuzare.game'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"

        manifestPlaceholders = [admobAppId: admobAppId]
        resValue 'string', 'admob_rewarded_id', admobRewardedId
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword cfg('KEYSTORE_PASSWORD')
                keyAlias cfg('KEY_ALIAS')
                keyPassword cfg('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // نخليه بدون تصغير عشان جسر JavaScript (@JavascriptInterface) ما ينكسر
            minifyEnabled false
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ملفات اللعبة (مجلد web) تنحط داخل الـ APK
    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/../web"]
        }
    }
}

// تنبيه واضح لو بنيت نسخة النشر وما زالت الإعلانات تجريبية أو بدون توقيع
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        if (admobAppId == testAdmobAppId) logger.warn('⚠️  نسخة النشر فيها معرّفات AdMob تجريبية: الإعلانات ما بتجيب فلوس. حط ADMOB_APP_ID و ADMOB_REWARDED_ID.')
        if (!hasKeystore) logger.warn('⚠️  نسخة النشر بدون مفتاح توقيع (KEYSTORE_FILE): Google Play ما يقبلها.')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
